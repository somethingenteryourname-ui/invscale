name: build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDKs (21 for Minecraft, 25 for Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: |
            21
            25
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build remapGametestJar --stacktrace 2>&1 | tee build.log

      - name: Verify jar
        run: |
          set -e
          JAR=$(ls build/libs/*.jar | grep -v sources)
          echo "::notice title=Jar::$JAR ($(stat -c%s "$JAR") bytes)"
          unzip -p "$JAR" fabric.mod.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('::notice title=fabric.mod.json valid::id=%s version=%s minecraft=%s env=%s depends=%s' % (d['id'], d['version'], d['depends']['minecraft'], d['environment'], ','.join(d['depends'])))"
          unzip -Z1 "$JAR" | grep -qx "dev/invscale/InvScaleClient.class"
          unzip -p "$JAR" assets/invscale/lang/en_us.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('::notice title=Language file valid::%d strings' % len(d))"
          if unzip -Z1 "$JAR" | grep -q "^com/terraformersmc"; then echo "::error::Mod Menu stubs leaked into jar"; exit 1; fi
          if unzip -Z1 "$JAR" | grep -q "dev/invscale/test"; then echo "::error::Game test leaked into jar"; exit 1; fi
          # Mixin targets must be remapped to intermediary names in the production jar.
          for c in GameRendererMixin MouseHandlerMixin ScreenMixin GuiGraphicsMixin GuiRendererMixin; do
            S=$(unzip -p "$JAR" dev/invscale/mixin/$c.class | strings | grep -oE "(class|method|field)_[0-9]+" | sort -u | head -6 | tr '\n' ' ')
            if [ -z "$S" ]; then echo "::error::$c has no intermediary references"; exit 1; fi
            echo "::notice title=$c remapped::$S"
          done
          if unzip -p "$JAR" dev/invscale/mixin/GameRendererMixin.class | strings | grep -q "renderWithTooltipAndSubtitles"; then echo "::error::GameRendererMixin target not remapped"; exit 1; fi

      - name: Run InvScale inside a real Minecraft 1.21.11 client
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          set -o pipefail
          ./gradlew runProductionClientGameTest --stacktrace 2>&1 | tee gametest.log

      - name: Publish test screenshots
        if: always() && github.event_name == 'push'
        run: |
          set -e
          [ -d run/screenshots ] || exit 0
          rm -rf /tmp/shots && mkdir /tmp/shots && cp run/screenshots/*.png /tmp/shots/ || true
          cd /tmp/shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots from ${GITHUB_SHA}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
          echo "::notice title=Screenshots::$(ls | tr '\n' ' ')"

      - name: Publish logs
        if: always() && github.event_name == 'push'
        run: |
          rm -rf /tmp/logs && mkdir /tmp/logs
          cp build.log gametest.log /tmp/logs/ 2>/dev/null || true
          cp run/logs/latest.log /tmp/logs/client-latest.log 2>/dev/null || true
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Logs from ${GITHUB_SHA}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: InvScale
          path: build/libs/

      - name: Publish release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          JAR=$(ls build/libs/*.jar | grep -v sources)
          TAG="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --title "InvScale ${TAG#v} for Minecraft 1.21.11" \
              --notes "Client-side Fabric mod for Minecraft 1.21.11. Requires Fabric Loader 0.17.3+ and Fabric API. Built and tested in a real 1.21.11 client by CI."
          fi
          echo "::notice title=Release::$TAG -> $(basename $JAR)"
