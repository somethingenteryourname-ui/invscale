plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	// In-game automated tests (run in a real client on CI). Never shipped in the mod jar.
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

repositories {
	// Loom adds the Minecraft, Fabric and Mojang repositories automatically.
}

configurations {
	productionModsResolve {
		transitive = true
		canBeConsumed = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Production (intermediary) jars used to launch a real client for the game test.
	productionModsResolve "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [
		"version"          : project.mod_version,
		"minecraft_version": project.minecraft_version,
		"loader_version"   : project.loader_version
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// Compile-time stubs for the optional Mod Menu API. The real classes are provided
	// by Mod Menu at runtime (when installed); they must never ship inside our jar.
	exclude 'com/terraformersmc/**'

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

sourcesJar {
	exclude 'com/terraformersmc/**'
}

// ------------------------------------------------------------------------------------------------ game test

tasks.register('gametestJar', Jar) {
	from sourceSets.gametest.output
	archiveClassifier = 'gametest-dev'
	destinationDirectory = layout.buildDirectory.dir('gametest')
}

tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
	dependsOn tasks.gametestJar
	inputFile = tasks.named("gametestJar", Jar).flatMap { it.archiveFile }
	archiveClassifier = 'gametest'
	destinationDirectory = layout.buildDirectory.dir('gametest')
	addNestedDependencies = false
	classpath.from(sourceSets.gametest.compileClasspath)
}

// Launches a real Minecraft 1.21.11 client (under xvfb on CI) with the final remapped InvScale jar,
// Fabric API and the client game test API, runs InvScaleClientGameTest and exits.
tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	dependsOn tasks.remapJar, tasks.remapGametestJar
	def fabricJars = configurations.productionModsResolve.filter { file ->
		file.name.startsWith("fabric-api-") || file.name.startsWith("fabric-client-gametest-api-v1-")
	}
	mods.from(fabricJars, tasks.remapJar.archiveFile, tasks.remapGametestJar.archiveFile)
	jvmArgs.add("-Dfabric.client.gametest")
	jvmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
}
